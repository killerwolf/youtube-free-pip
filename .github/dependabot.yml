version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # No target-branch on purpose: develop is already the default branch, so
    # pull requests open against it anyway, and setting it would exclude this
    # entry from security updates.
    labels:
      - dependencies
    # CLAUDE.md requires conventional commits; this yields "chore(deps): ..."
    # and "chore(deps-dev): ..." so Dependabot's own commits conform.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One pull request a week for everything routine, rather than one per
      # package. Majors are excluded, so they still arrive one at a time.
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Migrations in their own right, done by hand rather than by a bot: each
      # needs code changes, not just a version bump.
      #
      # Note what this costs. ignore applies to security updates too, so if an
      # advisory on one of these is only fixed by a major, no fix PR is raised.
      # It is not silent — Dependabot alerts are enabled on the repository and
      # are not filtered by this file — but the fix is then a manual job.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      # lucide-react is 0.x, where semver calls 0.544 -> 0.545 a minor, so
      # those still ride the grouped PR; only the 1.x jump is held back.
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Same split as npm above: routine bumps together, majors on their own,
      # since an action's major is where the breaking change lives.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
