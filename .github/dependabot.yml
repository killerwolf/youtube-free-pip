version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # No target-branch on purpose. develop is this repository's default branch,
    # so pull requests already open against it, which is what the GitFlow here
    # wants; main is only ever reached by a release. Setting target-branch
    # explicitly would be redundant and would stop these settings applying to
    # Dependabot's security updates.
    labels:
      - dependencies
    # CLAUDE.md requires conventional commits; this yields "chore(deps): ..."
    # and "chore(deps-dev): ..." so Dependabot's own commits conform.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One pull request a week for everything routine, rather than one per
      # package. Majors are excluded, so they still arrive one at a time.
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Migrations in their own right, done by hand rather than by a bot:
      # each needs code changes, not just a version bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
