<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <!-- viewport-fit=cover lets the page run edge to edge under the notch and
         home indicator once installed; the layout pads with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Added to the iPhone home screen, open without Safari's address and tab
         bars. The manifest's display:standalone covers iOS 17.4+; the meta tags
         cover older releases and let the status bar sit over our dark ground. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YT Free PiP" />
    <title>YouTube Free PiP</title>
    <meta
      name="description"
      content="Watch YouTube playlists with Picture-in-Picture support. No login required — paste a playlist URL and pick up right where you left off."
    />
    <meta property="og:title" content="YouTube Free PiP" />
    <meta
      property="og:description"
      content="Watch YouTube playlists with Picture-in-Picture support. No login required — paste a playlist URL and pick up right where you left off."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://free-yt-pip.netlify.app/" />
    <meta
      property="og:image"
      content="https://free-yt-pip.netlify.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="YouTube Free PiP — watch YouTube playlists in Picture-in-Picture"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://free-yt-pip.netlify.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
