[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 
# Netlify has no default MIME type for .webmanifest and would serve it as
# application/octet-stream, which installers may refuse.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
